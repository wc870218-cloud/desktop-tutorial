<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wuyuhan</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #e8f0ff, #f5f7fb);
    }

    main {
      width: min(720px, 100%);
      padding: 48px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(27, 65, 135, .15);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    p {
      color: #65728a;
      font-size: 18px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <h1>wuyuhan</h1>
    <p>这是我使用 GitHub Pages 部署的第一个网站。</p>
  </main>
</body>
</html>
